server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="pt-BR"><body><h1>Servidor MICROSERVICE</h1><ul><li><a href="/dataweb/">DataWeb</a></li></ul></body></html>';
    }

    location = /dataweb {
        return 301 /dataweb/;
    }

    location /dataweb {
        proxy_pass http://127.0.0.1:5267;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        proxy_connect_timeout 620s;
    }
}
