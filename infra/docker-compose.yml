services:
  dataweb-api:
    container_name: dataweb-api
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:5267:5267"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5267
      PathBase: /dataweb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5267/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
